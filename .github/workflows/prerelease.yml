name: Pre-release to NPM

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to release from (default: develop)'
        required: false
        type: string
        default: 'develop'
      version_suffix:
        description: 'Optional version suffix (e.g., "rc1", "beta1"). Leave empty for auto-generated beta version.'
        required: false
        type: string
      description:
        description: 'Optional description for this pre-release'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prerelease:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.inputs.branch || 'develop' }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup
        uses: ./.github/actions/setup

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      # The token comes in through env instead of being pasted into the script
      # text. The double-quoted echo expands it, so ~/.npmrc holds the value.
      - name: Setup NPM Authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

      # Workflow inputs, and the version derived from them, reach every script
      # in this job through env and are read as data. Nothing is pasted into
      # the script text, so a quote in an input is just a character.
      - name: Generate pre-release version
        id: version
        env:
          VERSION_SUFFIX: ${{ github.event.inputs.version_suffix }}
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          COMMIT_SHA=${GITHUB_SHA::7}
          TIMESTAMP=$(date +%Y%m%d%H%M%S)

          # Remove any existing pre-release tag
          BASE_VERSION=$(echo $CURRENT_VERSION | sed 's/-.*$//')

          # Use custom suffix if provided, otherwise auto-generate beta version
          if [ -n "$VERSION_SUFFIX" ]; then
            # Only SemVer pre-release identifiers pass: dot-separated letters,
            # digits and hyphens, with no leading zero in a number. The suffix
            # ends up in $GITHUB_OUTPUT, the npm version and the git tag, and
            # npm rewrites looser forms (rc.01 becomes rc.1, +build is dropped),
            # which would publish a version that differs from the tag. The
            # error leaves the value out, because it failed the check.
            IDENTIFIER='(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
            SUFFIX_PATTERN="^${IDENTIFIER}([.]${IDENTIFIER})*\$"
            if [[ ! "$VERSION_SUFFIX" =~ $SUFFIX_PATTERN ]]; then
              echo "::error::version_suffix must be SemVer pre-release identifiers such as rc1 or beta.2 (dot-separated letters, digits and hyphens; no leading zero in a number)."
              exit 1
            fi
            PRERELEASE_VERSION="${BASE_VERSION}-${VERSION_SUFFIX}"
          else
            PRERELEASE_VERSION="${BASE_VERSION}-beta.${TIMESTAMP}.${COMMIT_SHA}"
          fi

          echo "version=$PRERELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Generated pre-release version: $PRERELEASE_VERSION"

          # Update package.json version
          npm version "$PRERELEASE_VERSION" --no-git-tag-version

      # Nitro Modules require generated bindings before `yarn prepare` can run.
      # The nitrogen/ directory is gitignored and bob's custom target only runs
      # when triggered explicitly here (parity with ci.yml).
      - name: Generate nitrogen code
        run: yarn nitrogen

      - name: Build package
        run: yarn prepare

      - name: Run tests
        run: yarn test --coverage --maxWorkers=2

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-prerelease
          path: |
            coverage/**
          if-no-files-found: warn

      - name: Upload coverage reports to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./coverage/lcov.info
          flags: prerelease
          fail_ci_if_error: false

      - name: Publish coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            echo "### Test Coverage" >> $GITHUB_STEP_SUMMARY
            node -e '
              const fs = require("fs");
              const s = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8"));
              const t = s.total;
              const row = (k,v)=>`| ${k} | ${v.pct}% | ${v.covered}/${v.total} |`;
              console.log("| Metric | % | Covered/Total |\n|---|---:|---:|\n" +
                [
                  row("Statements", t.statements),
                  row("Branches", t.branches),
                  row("Functions", t.functions),
                  row("Lines", t.lines)
                ].join("\n")
              );
            ' >> $GITHUB_STEP_SUMMARY
          else
            echo "No coverage summary found." >> $GITHUB_STEP_SUMMARY
          fi

      # Directly before the publish, so nothing can change the tree after this
      # check. A failure here skips the publish, the tag and the release. The
      # script comes from the branch being released, so a branch older than the
      # script stops here too.
      - name: Assert npm pack contents
        run: |
          set -o pipefail
          npm pack --dry-run --ignore-scripts --json | node .github/scripts/assert-pack-contents.mjs

      - name: Publish to NPM (beta tag)
        run: |
          npm publish --access public --tag beta --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Pre-release Tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add package.json
          git commit -m "chore: pre-release $VERSION [skip ci]"
          git tag -a "v$VERSION" -m "Pre-release v$VERSION"
          git push origin "v$VERSION"

      # The description is read from env, so the release body gets it as typed,
      # quotes included.
      - name: Create GitHub Pre-release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = process.env.VERSION;
            const tagName = `v${version}`;

            const description = process.env.DESCRIPTION || 'This is a beta release from the develop branch.';

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `Pre-release ${tagName}`,
              body: `Pre-release version ${version}\n\n` +
                    `${description}\n\n` +
                    `Install with: \`npm install @gabriel-sisjr/react-native-sync-provider@beta\`\n\n` +
                    `Commit: ${context.sha}`,
              draft: false,
              prerelease: true
            });

      - name: Comment on related PRs
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const version = process.env.VERSION;

            // Find PRs that were just merged
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              base: 'develop',
              sort: 'updated',
              direction: 'desc',
              per_page: 5
            });

            const recentlyMergedPRs = prs.filter(pr => {
              const mergedAt = new Date(pr.merged_at);
              const fiveMinutesAgo = new Date(Date.now() - 5 * 60 * 1000);
              return pr.merged_at && mergedAt > fiveMinutesAgo;
            });

            for (const pr of recentlyMergedPRs) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `A pre-release version has been published: **v${version}**\n\n` +
                      `You can install it with:\n` +
                      `\`\`\`bash\n` +
                      `npm install @gabriel-sisjr/react-native-sync-provider@beta\n` +
                      `# or\n` +
                      `yarn add @gabriel-sisjr/react-native-sync-provider@beta\n` +
                      `\`\`\`\n\n` +
                      `This version includes your changes and is available for testing!`
              });
            }
