name: CI
on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  merge_group:
    types:
      - checks_requested
  workflow_dispatch:

# Least privilege, independent of the repository's default token setting: no job
# here pushes, comments or publishes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint files
        run: yarn lint

      - name: Typecheck files
        run: yarn typecheck

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run unit tests
        run: yarn test --maxWorkers=2 --coverage

  build-library:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build package
        run: yarn prepare

      - name: Report npm pack size
        run: |
          PACK_JSON=$(npm pack --dry-run --json --ignore-scripts)
          node -e '
            const fs = require("fs");
            const data = JSON.parse(fs.readFileSync(0, "utf8"));
            const pkg = Array.isArray(data) ? data[0] : data;
            const fmt = (b) => (b / 1024).toFixed(1) + " KiB";
            const lines = [
              "### Package size (npm pack --dry-run)",
              "",
              "| Metric | Size |",
              "|---|---:|",
              `| Tarball (packed) | ${fmt(pkg.size)} (${pkg.size} bytes) |`,
              `| Unpacked | ${fmt(pkg.unpackedSize)} (${pkg.unpackedSize} bytes) |`,
              `| File count | ${pkg.entryCount} |`,
            ];
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join("\n") + "\n");
          ' <<< "$PACK_JSON"

      # Everything else in CI reads the repo tree, so this is the only check on
      # what consumers actually get from npm.
      - name: Assert npm pack contents
        run: |
          set -o pipefail
          npm pack --dry-run --ignore-scripts --json | node .github/scripts/assert-pack-contents.mjs

  build-android:
    runs-on: ubuntu-latest

    env:
      TURBO_CACHE_DIR: .turbo/android
      turbo_cache_hit: ''

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate nitrogen code
        run: yarn nitrogen

      - name: Cache turborepo for Android
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-android-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-android-

      - name: Check turborepo cache for Android
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:android').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Install JDK
        if: env.turbo_cache_hit != 1
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        if: env.turbo_cache_hit != 1
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"


      - name: Cache Gradle
        if: env.turbo_cache_hit != 1
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build example for Android
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: |
          yarn turbo run build:android --cache-dir="${{ env.TURBO_CACHE_DIR }}"

  build-ios:
    runs-on: macos-latest

    env:
      # Deliberately not a version pin. `macos-latest` moves between images, and
      # a pin stops resolving once the image no longer ships that Xcode.
      # `latest-stable` resolves against what the image provides, betas excluded.
      XCODE_VERSION: 'latest-stable'
      TURBO_CACHE_DIR: .turbo/ios
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1
      turbo_cache_hit: ''

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Generate nitrogen code
        run: yarn nitrogen

      - name: Cache turborepo for iOS
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: ${{ env.TURBO_CACHE_DIR }}
          key: ${{ runner.os }}-turborepo-ios-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-turborepo-ios-

      - name: Check turborepo cache for iOS
        run: |
          TURBO_CACHE_STATUS=$(node -p "($(yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}" --dry=json)).tasks.find(t => t.task === 'build:ios').cache.status")

          if [[ $TURBO_CACHE_STATUS == "HIT" ]]; then
            echo "turbo_cache_hit=1" >> $GITHUB_ENV
          fi

      - name: Use appropriate Xcode version
        if: env.turbo_cache_hit != 1
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      # Records the toolchain actually in use. If Xcode selection ever breaks
      # again, the log shows what WAS available instead of only what wasn't.
      - name: Report selected Xcode toolchain
        if: env.turbo_cache_hit != 1
        run: |
          echo "DEVELOPER_DIR=${DEVELOPER_DIR:-<unset>}"
          xcodebuild -version
          echo "Xcode versions available on this runner:"
          ls -1 /Applications | grep -i '^Xcode' || echo "  (none found)"

      - name: Install cocoapods
        if: env.turbo_cache_hit != 1
        run: |
          cd example
          bundle install
          bundle exec pod repo update --verbose
          bundle exec pod install --project-directory=ios

      - name: Build example for iOS
        id: build-example
        run: |
          yarn turbo run build:ios --cache-dir="${{ env.TURBO_CACHE_DIR }}"

      # `react-native build-ios` discards xcodebuild's stderr and filters its
      # stdout, so the step above can fail without saying why.
      - name: Report iOS build failure
        if: failure() && steps.build-example.outcome == 'failure'
        run: |
          bash .github/scripts/report-ios-build-failure.sh \
            "$HOME"/Library/Developer/Xcode/DerivedData/SyncProviderExample-*/Logs/Build/*.xcactivitylog

      # Opens in Xcode. For plain text: gunzip -c <log> | tr '\r' '\n'
      - name: Upload iOS build log
        if: failure() && steps.build-example.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-build-log
          path: ~/Library/Developer/Xcode/DerivedData/SyncProviderExample-*/Logs/Build/*.xcactivitylog
          if-no-files-found: ignore
          retention-days: 14

  test-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Finalize Android SDK
        run: |
          /bin/bash -c "yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null"

      - name: Cache Gradle
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: ${{ runner.os }}-gradle-tests-${{ hashFiles('example/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-tests-
            ${{ runner.os }}-gradle-

      - name: Generate nitrogen code
        run: yarn nitrogen

      - name: Run Android unit tests
        env:
          JAVA_OPTS: "-XX:MaxHeapSize=6g"
        run: |
          cd example/android
          ./gradlew :gabriel-sisjr_react-native-sync-provider:testDebugUnitTest --stacktrace

      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-test-reports
          path: |
            android/build/reports/tests/
            android/build/reports/jacoco/
            android/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  test-ios:
    runs-on: macos-latest

    env:
      # Same rationale as XCODE_VERSION in build-ios.
      XCODE_VERSION: 'latest-stable'
      RCT_USE_RN_DEP: 1
      RCT_USE_PREBUILT_RNCORE: 1
      IOS_TEST_SCHEME: SyncProvider-Unit-Tests

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Use appropriate Xcode version
        uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Report selected Xcode toolchain
        run: |
          echo "DEVELOPER_DIR=${DEVELOPER_DIR:-<unset>}"
          xcodebuild -version
          echo "Xcode versions available on this runner:"
          ls -1 /Applications | grep -i '^Xcode' || echo "  (none found)"

      - name: Generate nitrogen code
        run: yarn nitrogen

      - name: Install cocoapods
        run: |
          cd example
          bundle install
          bundle exec pod repo update --verbose
          bundle exec pod install --project-directory=ios

      - name: List available schemes
        run: |
          cd example/ios
          xcrun xcodebuild -workspace SyncProviderExample.xcworkspace -list || \
            xcrun xcodebuild -list

      # Diagnostic: dumps the simulator catalog the runner actually ships with.
      # Non-blocking so a transient simctl failure can never fail the job.
      - name: Show available iOS simulators
        continue-on-error: true
        run: |
          xcrun simctl list devices iOS available

      - name: Run iOS unit tests
        run: |
          set -o pipefail

          # Chosen once, from what the image really has, so xcodebuild runs
          # exactly once: a test failure is never retried on another device, and
          # the result bundle of that failure is the one that gets uploaded.
          # iPhone 17 is the first choice; the script falls back on its own.
          SIMULATOR_ID="$(xcrun simctl list -j devices available |
            node .github/scripts/pick-ios-simulator.mjs "iPhone 17" "iPhone 17 Pro" "iPhone Air")"

          cd example/ios

          # Pipe xcodebuild output through xcbeautify when present (it ships on
          # the GitHub macos-latest image). Fallback to raw output otherwise.
          # --preserve-unbeautified keeps the lines xcbeautify has no pattern
          # for, which include the output of a failing script phase.
          if command -v xcbeautify >/dev/null 2>&1; then
            PRETTIFY=(xcbeautify --renderer github-actions --preserve-unbeautified)
          else
            PRETTIFY=(cat)
          fi

          xcrun xcodebuild test \
            -workspace SyncProviderExample.xcworkspace \
            -scheme "${IOS_TEST_SCHEME}" \
            -destination "platform=iOS Simulator,id=${SIMULATOR_ID}" \
            -resultBundlePath build/SyncProviderTests.xcresult \
            -enableCodeCoverage YES \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO | "${PRETTIFY[@]}"

      # The wildcard keeps the .xcresult folder in the artifact, which Xcode needs
      # to open it. A plain path would put its contents at the artifact root.
      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios-test-results
          path: example/ios/build/*.xcresult
          if-no-files-found: ignore
          retention-days: 14
